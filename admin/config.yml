backend:
  name: github
  repo: bestservicesh-dot/bsh-siteweb # Votre dépôt GitHub réel
  branch: main
  base_url: https://bsh-siteweb.vercel.app # Remplacez par votre domaine final si vous le liez
  auth_endpoint: api/auth

media_folder: "assets/images/uploads"
public_folder: "/assets/images/uploads"

collections:
  - name: "site_config"
    label: "⚙️ Configuration Globale"
    delete: false
    editor:
      preview: false
    files:
      - file: "data/general.json"
        label: "📞 Contact, Slogan & Réseaux"
        name: "general"
        fields:
          - { label: "Téléphone BSH", name: "phone", widget: "string" }
          - { label: "Adresse Email", name: "email", widget: "string" }
          - { label: "Adresse physique", name: "address", widget: "string" }
          - { label: "Lien WhatsApp direct", name: "whatsapp", widget: "string" }
          - { label: "Slogan d'entreprise", name: "slogan", widget: "string" }
          - { label: "Titre Opération Zéro Goutte", name: "campaign_title", widget: "string" }
          - { label: "Description Opération Zéro Goutte", name: "campaign_desc", widget: "text" }
          - { label: "Logo d'entreprise (Image personnalisée)", name: "logo_url", widget: "image", required: false }
          - { label: "Lien Page Facebook", name: "facebook_url", widget: "string", required: false }
          - { label: "Lien Page LinkedIn", name: "linkedin_url", widget: "string", required: false }
          - { label: "Lien Page Instagram", name: "instagram_url", widget: "string", required: false }
          - { label: "Lien Page TikTok", name: "tiktok_url", widget: "string", required: false }
          - { label: "Registre de Commerce (RCCM)", name: "rccm", widget: "string" }
          - { label: "Identifiant Fiscal Unique (IFU)", name: "ifu", widget: "string" }
          - { label: "Titre principal de l'accueil", name: "hero_title", widget: "string" }
          - { label: "Sous-titre d'accueil", name: "hero_subtitle", widget: "text" }
          - label: "Chiffres Clés (Statistiques)"
            name: "stats"
            widget: "list"
            fields:
              - { label: "Valeur (ex: 150+)", name: "value", widget: "string" }
              - { label: "Libellé (ex: Projets réalisés)", name: "label", widget: "string" }
          - { label: "Titre de la section À propos", name: "about_title", widget: "string" }
          - { label: "À propos - Paragraphe 1", name: "about_text_1", widget: "text" }
          - { label: "À propos - Paragraphe 2", name: "about_text_2", widget: "text" }
          - label: "À propos - Atouts clés"
            name: "about_features"
            widget: "list"

      - file: "data/about.json"
        label: "ℹ️ Page À Propos (Histoire, Promoteur & Valeurs)"
        name: "about_page"
        fields:
          - { label: "Titre Histoire", name: "history_title", widget: "string" }
          - { label: "Histoire - Paragraphe 1", name: "history_text_1", widget: "text" }
          - { label: "Histoire - Paragraphe 2", name: "history_text_2", widget: "text" }
          - { label: "Titre Mission", name: "mission_title", widget: "string" }
          - { label: "Mission - Description", name: "mission_text", widget: "text" }
          - { label: "Titre Vision", name: "vision_title", widget: "string" }
          - { label: "Vision - Description", name: "vision_text", widget: "text" }
          - { label: "Titre Mot du Promoteur", name: "promoter_title", widget: "string" }
          - { label: "Nom du Promoteur", name: "promoter_name", widget: "string" }
          - { label: "Texte Mot du Promoteur", name: "promoter_text", widget: "text" }
          - { label: "Photo du Promoteur", name: "promoter_photo", widget: "image" }
          - { label: "Titre Nos Valeurs", name: "values_title", widget: "string" }
          - { label: "Sous-titre Valeurs", name: "values_subtitle", widget: "string" }
          - label: "Nos Valeurs (Liste)"
            name: "values"
            widget: "list"
            fields:
              - { label: "Icône / Émoji", name: "icon", widget: "string" }
              - { label: "Nom de la valeur", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }

      - file: "data/communiques.json"
        label: "📢 Communiqués & Avis (Accueil)"
        name: "communiques_config"
        fields:
          - { label: "Titre principal section", name: "title", widget: "string" }
          - { label: "Sous-titre section", name: "subtitle", widget: "string" }
          - label: "Liste des communiqués"
            name: "items"
            widget: "list"
            fields:
              - { label: "Date de publication (AAAA-MM-JJ)", name: "date", widget: "string" }
              - { label: "Titre du communiqué", name: "title", widget: "string" }
              - { label: "Texte complet", name: "content", widget: "text" }
              - { label: "Lien d'action (Optionnel)", name: "link", widget: "string", required: false }
              - { label: "Texte d'affichage du lien (Optionnel)", name: "link_text", widget: "string", required: false }

      - file: "data/recrutements.json"
        label: "💼 Offres d'Emploi & Recrutements"
        name: "recrutement_page"
        fields:
          - { label: "Titre Section Recrutement", name: "title", widget: "string" }
          - { label: "Sous-titre Section Recrutement", name: "subtitle", widget: "string" }
          - label: "Liste des opportunités ouvertes"
            name: "items"
            widget: "list"
            fields:
              - { label: "ID Unique (sans espace, ex: macon)", name: "id", widget: "string" }
              - { label: "Intitulé du poste", name: "title", widget: "string" }
              - { label: "Type de contrat", name: "contract", widget: "select", options: ["CDI", "CDD", "Stage", "Prestation", "Intérim"] }
              - { label: "Lieu", name: "location", widget: "string", default: "Abomey-Calavi / Cotonou" }
              - { label: "Date limite (AAAA-MM-JJ)", name: "deadline", widget: "string" }
              - { label: "Description / Profil recherché", name: "description", widget: "text" }

      - file: "data/immobilier.json"
        label: "🏠 Annonces Immobilières (Offres)"
        name: "immobilier_page"
        fields:
          - { label: "Titre Section Immobilier", name: "title", widget: "string" }
          - { label: "Sous-titre Section Immobilier", name: "subtitle", widget: "string" }
          - label: "Liste des biens immobiliers"
            name: "items"
            widget: "list"
            fields:
              - { label: "Titre de l'annonce", name: "title", widget: "string" }
              - { label: "Type d'offre", name: "type", widget: "select", options: ["Location", "Vente", "Gestion"] }
              - { label: "Type de bien", name: "property_type", widget: "select", options: ["Villa", "Appartement", "Parcelle / Terrain", "Bureau / Boutique"] }
              - { label: "Prix (FCFA)", name: "price", widget: "string" }
              - { label: "Lieu", name: "location", widget: "string" }
              - { label: "Photo du bien", name: "image", widget: "image" }
              - { label: "Description du bien", name: "description", widget: "text" }

  - name: "services"
    label: "🏗️ Pages de Services & Photos"
    folder: "data/services"
    extension: "json" # Indique à Decap CMS de chercher et d'écrire des fichiers .json
    format: "json"    # Indique le format d'écriture JSON
    create: true
    slug: "{{slug}}"
    editor:
      preview: false
    fields:
      - { label: "ID Unique (sans espace, ex: construction-batiment)", name: "id", widget: "string" }
      - { label: "Intitulé du Service", name: "title", widget: "string" }
      - { label: "Pôle d'Expertise", name: "pole", widget: "select", options: [ { label: "BTP, Génie Civil & Étanchéité", value: "btp" }, { label: "Digital, Graphisme & Imprimerie", value: "digital" }, { label: "Services & Multidisciplinaire", value: "multi" } ] }
      - { label: "Icône (Émoji)", name: "icon", widget: "string", default: "🏗️" }
      - { label: "Description courte (Accueil)", name: "short_description", widget: "text" }
      - { label: "Tarif indicatif", name: "price", widget: "string", default: "Sur devis personnalisé" }
      - { label: "Lien Personnel / Vidéo externe (Optionnel)", name: "custom_link", widget: "string", required: false }
      - { label: "Texte d'affichage du lien personnel (Optionnel)", name: "custom_link_text", widget: "string", required: false }
      - { label: "Description détaillée / Présentation", name: "description", widget: "markdown" }
      - label: "Galerie Photos du Service"
        name: "images"
        widget: "list"
        field: { label: "Photo", name: "image", widget: "image" }

  - name: "realisations"
    label: "📷 Réalisations (Mots & Multi-images)"
    folder: "data/realisations"
    extension: "json" # Indique à Decap CMS d'écrire en .json
    format: "json"    # Indique le format JSON
    create: true
    slug: "{{slug}}"
    editor:
      preview: false
    fields:
      - { label: "ID Unique du projet (sans espace)", name: "id", widget: "string" }
      - { label: "Titre du projet", name: "title", widget: "string" }
      - { label: "Catégorie", name: "category", widget: "select", options: ["Construction", "Rénovation", "Étanchéité", "Finitions", "Pavage", "Numérique", "Autres"] }
      - { label: "Ville (Bénin)", name: "city", widget: "string" }
      - { label: "Photo Principale", name: "main_image", widget: "image" }
      - { label: "Description du projet", name: "description", widget: "text" }
      - label: "Galerie d'images de la réalisation (Multi-photos)"
        name: "images"
        widget: "list"
        field: { label: "Photo supplémentaire", name: "image", widget: "image" }

  - name: "blog"
    label: "✍️ Blog, Conseils & Fiches PDF"
    folder: "data/blog"
    extension: "json" # Indique à Decap CMS d'écrire en .json
    format: "json"    # Indique le format JSON
    create: true
    slug: "{{slug}}"
    editor:
      preview: false
    fields:
      - { label: "ID Unique de l'article", name: "id", widget: "string" }
      - { label: "Titre de l'article", name: "title", widget: "string" }
      - { label: "Date de publication (AAAA-MM-JJ)", name: "date", widget: "string" }
      - { label: "Catégorie", name: "category", widget: "select", options: ["Conseil BTP", "Astuces", "Fiche Technique", "Actualité"] }
      - { label: "Image de couverture", name: "image", widget: "image" }
      - { label: "Résumé court (Liste)", name: "summary", widget: "text" }
      - { label: "Contenu détaillé de l'article", name: "content", widget: "markdown" }
      - { label: "Fiche Technique PDF à télécharger (Optionnel)", name: "pdf_file", widget: "file", required: false }
      - { label: "Téléchargement du PDF réservé aux membres connectés", name: "is_premium", widget: "boolean", default: true }
